<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151918" />
    <title>Pixel Decomposer - 设置</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://unpkg.com/lucide@0.468.0"></script>
    <script defer src="i18n.js"></script>
    <script defer src="settings.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <a class="brand" data-settings-return href="index.html" aria-label="Pixel Decomposer 贴图拆分"><span class="brand-mark" aria-hidden="true"><b></b><b></b><b></b><b></b></span><span>Pixel<br /><em>Decomposer</em></span></a>
        <div class="project-name-wrap"><span class="save-state">设置</span></div>
        <div class="appbar-actions"><a class="command-button" data-settings-return href="index.html" aria-label="返回贴图拆分"><i data-lucide="arrow-left" aria-hidden="true"></i><span>贴图拆分</span></a></div>
      </header>
      <main class="settings-shell" aria-label="设置">
        <section class="settings-panel">
          <div class="settings-heading"><i data-lucide="languages" aria-hidden="true"></i><div><h1>界面语言</h1><p>选择 Pixel Decomposer 的显示语言</p></div></div>
          <label class="settings-field" for="languageSelect"><span>界面语言</span><select id="languageSelect" aria-label="界面语言"><option value="zh-CN">中文</option><option value="ja">日本語</option><option value="en">English</option></select></label>
        </section>
      </main>
    </div>
  </body>
</html>
